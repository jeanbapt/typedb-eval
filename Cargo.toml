[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/fixtures",
    "crates/postgres",
    "crates/typedb",
    "crates/runner",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
benchmark-core = { path = "crates/core" }
benchmark-fixtures = { path = "crates/fixtures" }
benchmark-postgres = { path = "crates/postgres" }
benchmark-typedb = { path = "crates/typedb" }

chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
rand_chacha = "0.3"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
typedb-driver = { version = "3.12" }
clap = { version = "4", features = ["derive"] }
hdrhistogram = "7"
csv = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
